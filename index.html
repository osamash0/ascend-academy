    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Inter, self-hosted (GDPR: no Google CDN — see src/index.css).

      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:title" content="Learnstation" />
    <meta property="og:description" content="Upload a lecture. Get smart notes, quizzes, and a personal AI tutor grounded in your own course content." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.ico" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.ico" />
  </head>
