# Drop-in for db-backup.service -> /etc/systemd/system/db-backup.service.d/heartbeat.conf
# ExecStartPost of a oneshot runs only when db-backup.sh exited 0, so Better
# Stack hears from us only after a verified dump. No ping by the deadline = alert.
[Service]
ExecStartPost=/bin/sh -c '. /etc/learnstation-heartbeat.conf && [ -n "$BACKUP_URL" ] && curl -fsS -m 10 --retry 3 -o /dev/null "$BACKUP_URL"'
