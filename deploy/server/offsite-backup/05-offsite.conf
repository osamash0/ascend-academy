# Drop-in for db-backup.service -> /etc/systemd/system/db-backup.service.d/05-offsite.conf
# "05-" sorts before "heartbeat.conf", so the off-site upload runs BEFORE the
# Better Stack ping: the db-backup heartbeat only goes green when the dump is
# verified AND safely off the box.
[Service]
ExecStartPost=/usr/local/bin/offsite-backup.sh
